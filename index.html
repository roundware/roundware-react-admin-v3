<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta
      name="description"
      content="Roundware is a platform for participatory, location-based audio: sound walks, story maps and installations, where people listen and add their voices."
    />
    <!-- Link previews (Slack, Messages, social): the same for every page of
         the admin, since crawlers don't run the app. Absolute addresses, as
         previews need; change them with the admin's address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Roundware" />
    <meta property="og:title" content="Roundware: Build Location-Based Audio Experiences" />
    <meta
      property="og:description"
      content="Sound walks, story maps and installations, where people listen and add their voices."
    />
    <meta property="og:url" content="https://admin.roundware.app/" />
    <meta property="og:image" content="https://admin.roundware.app/brand/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Roundware logo over a map of sound zones, with the words Build Location-Based Audio Experiences" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Roundware: Build Location-Based Audio Experiences" />
    <meta
      name="twitter:description"
      content="Sound walks, story maps and installations, where people listen and add their voices."
    />
    <meta name="twitter:image" content="https://admin.roundware.app/brand/share.jpg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Roboto comes with the admin (src/index.tsx), not from Google; icons
         are MUI's SVGs, so the Material Icons font went unused. -->
    <title>Roundware Admin</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
